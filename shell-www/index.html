<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MECHA</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #10141b;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: 0.04em;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #3d4654;
        margin: 0;
        max-width: 320px;
      }
      button {
        margin-top: 8px;
        background: #2563eb;
        color: #ffffff;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MECHA</h1>
      <p>
        MECHA needs an internet connection to reach your account and run a
        diagnosis. Check your connection and try again.
      </p>
      <button type="button" onclick="window.location.replace('https://mechatech.io')">
        Try again
      </button>
    </main>
  </body>
</html>
